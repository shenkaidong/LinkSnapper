name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支上的旧任务自动取消，避免排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速门禁：类型 + 单元测试 + 构建。不需要浏览器，几十秒内出结果。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test:unit

      - name: 生产构建
        run: npm run build

  # 端到端冒烟：需要真实浏览器，代价高，放在 verify 之后。
  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 确认浏览器可用
        run: |
          for bin in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$bin" ]; then echo "找到浏览器：$bin"; found=1; fi
          done
          if [ -z "${found:-}" ]; then
            echo "运行环境未预装 Chrome，尝试安装 chromium"
            sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser
          fi

      - name: 生产构建
        run: npm run build

      - name: 冒烟测试
        run: bash scripts/run-smoke.sh

      - name: 失败时上传服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log
          path: /tmp/linksnapper-smoke-server.log
          if-no-files-found: ignore

  # Docker 镜像构建校验。没有这一环的话，Dockerfile 往往要等到真正部署时才暴露问题。
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: linksnapper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并检查健康接口
        run: |
          docker run -d --name linksnapper-ci -p 3000:3000 --shm-size=1g linksnapper:ci
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "容器内服务已就绪"
              curl -s http://127.0.0.1:3000/api/health
              exit 0
            fi
            sleep 2
          done
          echo "容器内服务未就绪，输出日志："
          docker logs linksnapper-ci
          exit 1
