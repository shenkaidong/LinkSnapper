name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支上的旧任务自动取消，避免排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速门禁：类型 + 单元测试 + 构建。不需要浏览器，几十秒内出结果。
  # 跨多个 Node 版本跑，尽早暴露「只在本机 Node 版本上才通过」的问题。
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test:unit

      - name: 生产构建
        run: npm run build

  # 端到端冒烟：需要真实浏览器，代价高，放在 verify 之后。
  # 浏览器不再依赖发行版包，而是用 scripts/install-chrome.mjs 下载与
  # puppeteer-core 锁定的同一个 Chrome-for-Testing 构建 —— 跨 ubuntu / macos
  # 都拿到同一个版本，避免「CI 的 chromium 版本和系统对不上」这类漂移。
  smoke:
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装与 puppeteer-core 匹配的 Chrome
        run: node scripts/install-chrome.mjs

      - name: 设置 CHROME_PATH
        run: echo "CHROME_PATH=$(cat .chrome-executable-path)" >> "$GITHUB_ENV"

      - name: 生产构建
        run: npm run build

      - name: 冒烟测试
        run: bash scripts/run-smoke.sh

      - name: 失败时上传服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-log-${{ matrix.os }}
          path: /tmp/linksnapper-smoke-server.log
          if-no-files-found: ignore

  # Docker 镜像校验。
  #
  # 这个 job 的价值不只是「能不能构建」：镜像是本地唯一无法验证的部分。
  # 现在镜像内用 scripts/install-chrome.mjs 装的是与 puppeteer-core 锁定的
  # Chrome 版本（基于 Debian/glibc，避免 Alpine/musl 与 Chrome 不兼容的历史坑），
  # 所以这里真的起容器并跑一遍完整截图冒烟，而不是只探一下健康接口。
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖（宿主机侧跑冒烟用）
        run: npm ci

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: linksnapper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器
        run: |
          # 容器内的浏览器要访问容器自身的 127.0.0.1，因此需要精确放行该主机；
          # ENABLE_TEST_ENDPOINTS 用于重定向型 SSRF 用例。
          docker run -d --name linksnapper-ci \
            -p 3000:3000 --shm-size=1g \
            -e ALLOWED_INTERNAL_HOSTS=127.0.0.1 \
            -e ENABLE_TEST_ENDPOINTS=1 \
            -e RATE_LIMIT_CAPACITY=100 \
            linksnapper:ci

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "容器内服务已就绪："
              curl -s http://127.0.0.1:3000/api/health
              echo
              exit 0
            fi
            sleep 2
          done

          echo "容器内服务未就绪，输出日志："
          docker logs linksnapper-ci
          exit 1

      - name: 在容器上跑端到端截图冒烟
        run: BASE_URL=http://127.0.0.1:3000 node scripts/smoke-test.mjs

      - name: 失败时输出容器日志
        if: failure()
        run: docker logs linksnapper-ci || true
